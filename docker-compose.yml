# Neural Memory Core: base de datos + API + panel web.
# Uso: copia .env.example a .env, rellénalo y ejecuta "docker compose up -d --build".
name: neural-memory-core

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nmc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-nmc}
    volumes:
      # La memoria vive en este volumen, independiente del repositorio y de los contenedores.
      - nmc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Sin "ports": la base no se expone fuera de la red de Docker.

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      args:
        EXTRAS: ${NMC_IMAGE_EXTRAS-local-embeddings}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NMC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nmc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nmc}
      NMC_BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
      - nmc_models:/home/nmc/.cache
    ports:
      - "127.0.0.1:${NMC_API_PORT:-8000}:8000"

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${NMC_WEB_PORT:-3000}:3000"

volumes:
  nmc_pgdata:
  nmc_models:
